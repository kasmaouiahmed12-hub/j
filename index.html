<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena FPS 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="game">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="top"><b>ARENA FPS 3D</b><span id="stats">❤️ 100 · 🔫 12/12 · ⭐ 0</span></div>
    <div id="crosshair">+</div>
    <div id="message">CLIQUE POUR JOUER</div>
    <div id="help">ZQSD / WASD · Souris pour viser · Clic pour tirer · R pour recharger</div>
  </div>
  <div id="startScreen">
    <h1>ARENA FPS 3D</h1>
    <p>Élimine les ennemis et fais le meilleur score.</p>
    <button id="start">JOUER</button>
  </div>
</main>
<script src="game.js"></script>
</body>
</html>
